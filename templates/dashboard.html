{% extends "base.html" %}
{% block content %}
<div class="row text-center">
    <div class="col-md-12">
        <h1 class="display-4 mb-5">Welcome to Your Job Tracker</h1>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm border-primary">
            <div class="card-body py-4">
                <h5 class="card-title text-primary">Total Applications</h5>
                <p class="display-6 mb-0">{{ stats.total_apps }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm border-success">
            <div class="card-body py-4">
                <h5 class="card-title text-success">Interviews Scheduled</h5>
                <p class="display-6 mb-0">{{ stats.interviews }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
